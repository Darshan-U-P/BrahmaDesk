name: Brahma Engine Core

on:
  push:
    branches: [feature/brahma-engine-core]
    paths:
      - "engine/**"
      - ".github/workflows/brahma-engine.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/brahma-engine.yml"
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S engine -B engine/build -A x64
      - name: Build Release
        run: cmake --build engine/build --config Release
      - name: Run tests
        run: ctest --test-dir engine/build -C Release --output-on-failure
