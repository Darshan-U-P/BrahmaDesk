name: Brahma Engine CI

on:
  push:
    branches:
      - main
      - feature/brahma-engine-llama-backend
    paths:
      - "engine/**"
      - ".github/workflows/brahma-engine-ci.yml"
  pull_request:
    paths:
      - "engine/**"
      - ".github/workflows/brahma-engine-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: brahma-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msvc:
    name: Windows MSVC / CPU core
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure CMake
        run: >-
          cmake -S engine -B build/engine
          -DBRAHMA_ENGINE_BUILD_TESTS=ON
          -DBRAHMA_ENGINE_ENABLE_OPENMP=ON
          -DCMAKE_BUILD_TYPE=Release

      - name: Build engine and tests
        run: cmake --build build/engine --config Release --parallel

      - name: Run tests
        run: ctest --test-dir build/engine -C Release --output-on-failure

      - name: Upload test/build configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brahma-engine-ci-${{ runner.os }}
          path: |
            build/engine/CTestTestfile.cmake
            build/engine/Testing/Temporary/LastTest.log
          if-no-files-found: ignore
