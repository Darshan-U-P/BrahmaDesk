name: Smart installer CI

on:
  push:
    branches:
      - main
      - docs/m0-repository-audit-m1-hardware-design
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest app/tests tests -q

  desktop-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build React and TypeScript
        working-directory: desktop
        run: npm run build


  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Download official llama.cpp Windows CPU runtime for CI packaging
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ggml-org/llama.cpp/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -match "bin-win-cpu-x64\.zip$" } | Select-Object -First 1
          if (-not $asset) {
            throw "Could not find a Windows x64 CPU runtime asset in the latest llama.cpp release."
          }
          $archive = Join-Path $env:RUNNER_TEMP "llama-runtime.zip"
          $runtimeDir = Join-Path $env:RUNNER_TEMP "llama-runtime"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $runtimeDir -Force
          $server = Get-ChildItem -LiteralPath $runtimeDir -Filter "llama-server.exe" -Recurse | Select-Object -First 1
          if (-not $server) {
            throw "The downloaded llama.cpp archive did not contain llama-server.exe."
          }
          "LLAMA_CPP_RUNTIME_DIR=$($server.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci
      - name: Build Windows MSI installer
        working-directory: desktop
        run: npm run dist:win
      - name: Upload Windows MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: BrahmaDesk-Windows-MSI
          path: desktop/release/*.msi
          if-no-files-found: error

  packaged-backend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build packaged backend executable
        shell: pwsh
        run: ./backend/build_backend.ps1
